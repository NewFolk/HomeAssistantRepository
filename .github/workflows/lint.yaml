name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      google_workspace_baseline_ref:
        description: Published baseline for upgrade validation
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate
        required: true
        type: string
      google_workspace_baseline_ref:
        description: Exact published commit for the Google Workspace MCP upgrade test
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint ${{ matrix.addon }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        addon:
          - google_workspace_mcp
          - openlist
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Check out pinned add-on linter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: frenck/action-addon-linter
          ref: b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
          path: .ci/addon-linter
          persist-credentials: false

      - name: Run unmodified add-on linter
        env:
          ADDON: ${{ matrix.addon }}
        run: |
          docker build --tag local/addon-linter .ci/addon-linter/src
          docker run --rm \
            --env "INPUT_PATH=/github/workspace/${ADDON}" \
            --env INPUT_COMMUNITY=false \
            --volume "${GITHUB_WORKSPACE}:/github/workspace:ro" \
            local/addon-linter

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Test release and configuration helpers
        run: |
          python3 -m pip install -r openlist/tests/requirements.txt
          python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Check shell syntax
        run: |
          for script in openlist/run.sh openlist/prepare-config.sh; do
            sh -n "${script}"
          done
          for script in google_workspace_mcp/run.sh openlist/tests/smoke.sh; do
            bash -n "${script}"
          done

      - name: Run ShellCheck
        run: shellcheck openlist/run.sh openlist/prepare-config.sh google_workspace_mcp/run.sh openlist/tests/smoke.sh

  google-workspace-mcp:
    name: Google Workspace MCP (${{ matrix.arch }})
    needs: [lint, shell]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      BASELINE_REF: ${{ inputs.google_workspace_baseline_ref || github.event.pull_request.base.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Build image
        run: docker build --tag local/google-workspace-mcp:test ./google_workspace_mcp

      - name: Test runtime and OAuth contracts with synthetic credentials
        run: python3 google_workspace_mcp/tests/smoke.py local/google-workspace-mcp:test

      - name: Check out the published upgrade baseline
        if: env.BASELINE_REF != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASELINE_REF }}
          path: .ci/google-workspace-baseline
          persist-credentials: false

      - name: Build the published upgrade baseline
        if: env.BASELINE_REF != ''
        run: docker build --tag local/google-workspace-mcp:baseline .ci/google-workspace-baseline/google_workspace_mcp

      - name: Test an upgrade from the published image on the same data volume
        if: env.BASELINE_REF != ''
        run: python3 google_workspace_mcp/tests/smoke.py local/google-workspace-mcp:test local/google-workspace-mcp:baseline

  openlist:
    name: Build and smoke test (${{ matrix.arch }})
    needs:
      - lint
      - shell
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Read release versions
        id: versions
        shell: bash
        run: |
          addon_version="$(sed -nE 's/^version: "([^"]+)"/\1/p' openlist/config.yaml)"
          upstream_version="$(sed -nE 's|^FROM .*openlist:(v[^@]+)@sha256:.*$|\1|p' openlist/Dockerfile)"
          test -n "${addon_version}"
          test -n "${upstream_version}"
          echo "addon=${addon_version}" >> "${GITHUB_OUTPUT}"
          echo "upstream=${upstream_version}" >> "${GITHUB_OUTPUT}"

      - name: Check out pinned Supervisor validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: home-assistant/supervisor
          ref: c9e000812b7131fa1f1b72b483555083929d7f83 # 2026.10.2
          path: .ci/supervisor
          persist-credentials: false

      - name: Set up Supervisor-compatible Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install validation test dependencies
        run: python3 -m pip install -r openlist/tests/requirements.txt

      - name: Build image
        run: |
          docker build \
            --platform "linux/${{ matrix.arch }}" \
            --build-arg BUILD_ARCH="${{ matrix.arch }}" \
            --build-arg BUILD_VERSION="${{ steps.versions.outputs.addon }}" \
            --tag local/openlist-addon:test \
            ./openlist

      - name: Run smoke and persistence tests
        run: ./openlist/tests/smoke.sh local/openlist-addon:test "${{ steps.versions.outputs.upstream }}"

      - name: Test Supervisor option save and container restart contract
        run: python3 openlist/tests/supervisor-options.py .ci/supervisor local/openlist-addon:test

      - name: Test Ingress admin authentication boundaries
        run: python3 openlist/tests/ingress-auth-smoke.py local/openlist-addon:test
