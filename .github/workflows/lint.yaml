name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint ${{ matrix.addon }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        addon:
          - google_workspace_mcp
          - openlist
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Check out pinned add-on linter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: frenck/action-addon-linter
          ref: b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
          path: .ci/addon-linter
          persist-credentials: false

      - name: Run unmodified add-on linter
        env:
          ADDON: ${{ matrix.addon }}
        run: |
          docker build --tag local/addon-linter .ci/addon-linter/src
          docker run --rm \
            --env "INPUT_PATH=/github/workspace/${ADDON}" \
            --env INPUT_COMMUNITY=false \
            --volume "${GITHUB_WORKSPACE}:/github/workspace:ro" \
            local/addon-linter

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Test release and configuration helpers
        run: |
          python3 -m pip install -r openlist/tests/requirements.txt
          python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Check shell syntax
        run: |
          sh -n openlist/run.sh openlist/prepare-config.sh google_workspace_mcp/run.sh
          bash -n openlist/tests/smoke.sh

      - name: Run ShellCheck
        run: shellcheck openlist/run.sh openlist/prepare-config.sh google_workspace_mcp/run.sh openlist/tests/smoke.sh

  openlist:
    name: Build and smoke test (${{ matrix.arch }})
    needs:
      - lint
      - shell
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Read release versions
        id: versions
        shell: bash
        run: |
          addon_version="$(sed -nE 's/^version: "([^"]+)"/\1/p' openlist/config.yaml)"
          upstream_version="$(sed -nE 's|^FROM .*openlist:(v[^@]+)@sha256:.*$|\1|p' openlist/Dockerfile)"
          test -n "${addon_version}"
          test -n "${upstream_version}"
          echo "addon=${addon_version}" >> "${GITHUB_OUTPUT}"
          echo "upstream=${upstream_version}" >> "${GITHUB_OUTPUT}"

      - name: Check out pinned Supervisor validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: home-assistant/supervisor
          ref: c9e000812b7131fa1f1b72b483555083929d7f83 # 2026.10.2
          path: .ci/supervisor
          persist-credentials: false

      - name: Set up Supervisor-compatible Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install validation test dependencies
        run: python3 -m pip install -r openlist/tests/requirements.txt

      - name: Build image
        run: |
          docker build \
            --platform "linux/${{ matrix.arch }}" \
            --build-arg BUILD_ARCH="${{ matrix.arch }}" \
            --build-arg BUILD_VERSION="${{ steps.versions.outputs.addon }}" \
            --tag local/openlist-addon:test \
            ./openlist

      - name: Run smoke and persistence tests
        run: ./openlist/tests/smoke.sh local/openlist-addon:test "${{ steps.versions.outputs.upstream }}"

      - name: Test Supervisor option save and container restart contract
        run: python3 openlist/tests/supervisor-options.py .ci/supervisor local/openlist-addon:test

      - name: Test Ingress admin authentication boundaries
        run: python3 openlist/tests/ingress-auth-smoke.py local/openlist-addon:test
