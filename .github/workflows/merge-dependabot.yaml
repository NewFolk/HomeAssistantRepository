name: Merge Dependabot updates

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "11,26,41,56 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automatic-repository-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Run the controller from the trusted default branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method GET "repos/${GH_REPO}/contents/scripts/merge_dependabot.py" \
            -f "ref=${DEFAULT_BRANCH}" --jq .content \
            | base64 --decode > "${RUNNER_TEMP}/merge-dependabot.py"
          python3 "${RUNNER_TEMP}/merge-dependabot.py"
