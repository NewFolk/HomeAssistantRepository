name: OpenList
version: "1.4.0"
slug: openlist
description: A file-listing and sharing platform with support for many storage providers.
url: https://github.com/NewFolk/HomeAssistantRepository/tree/main/openlist
startup: services
init: false
stage: experimental
panel_icon: mdi:folder-multiple
arch:
  - amd64
ingress: true
# Keep Supervisor's panel_admin=true default: required for Ingress auto-login.
ingress_entry: openlist/
ingress_stream: true
backup: cold
ports:
  5244/tcp: null
ports_description:
  5244/tcp: OpenList web interface (optional; Ingress is enabled by default)
map:
  - type: share
    read_only: false
  - type: media
    read_only: true
options:
  ingress_auto_login: false
  openlist: {}
schema: false
