name: OpenList
version: "1.1.0"
slug: openlist
description: A file-listing and sharing platform with support for many storage providers.
url: https://github.com/NewFolk/HomeAssistantRepository/tree/main/openlist
startup: services
init: false
stage: experimental
panel_icon: mdi:folder-multiple
arch:
  - amd64
ingress: true
ingress_port: 5244
ingress_stream: true
backup: cold
ports:
  5244/tcp: null
ports_description:
  5244/tcp: OpenList web interface (optional; Ingress is enabled by default)
map:
  - type: share
    read_only: false
  - type: media
    read_only: true
