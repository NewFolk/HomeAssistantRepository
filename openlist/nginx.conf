user nginx;
worker_processes 1;
error_log /dev/stderr info;
pid /tmp/openlist-nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    map $http_x_forwarded_host $forwarded_host {
        default $http_x_forwarded_host;
        "" $http_host;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    server {
        listen 8099 default_server;
        server_name _;
        client_max_body_size 0;

        location / {
            allow 127.0.0.1;
            allow 172.30.32.2;
            deny all;

            proxy_pass http://127.0.0.1:5244;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_redirect /openlist/ %%INGRESS_ENTRY%%/openlist/;
            proxy_redirect /openlist %%INGRESS_ENTRY%%/openlist;
            proxy_cookie_path /openlist %%INGRESS_ENTRY%%/openlist;
            proxy_set_header Host $forwarded_host;
            proxy_set_header X-Forwarded-Host $forwarded_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Accept-Encoding "";

            sub_filter_once off;
            sub_filter_types application/javascript application/json text/css;
            sub_filter "/openlist" "%%INGRESS_ENTRY%%/openlist";
        }
    }
}
